; EKRAM production overrides; copied only into the runtime image.
; Governance Excel holds a PhpSpreadsheet workbook and a ZipStream buffer.
memory_limit = 512M
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off
; Do not include function arguments (which may contain credentials) in traces.
zend.exception_ignore_args = On
