# Applied at server level, including static files and error responses.
# HSTS is consumed only over HTTPS; production ingress already enforces HTTPS.
# No includeSubDomains/preload: unrelated subdomains have not been validated.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# QR scanning requires same-origin camera access, not microphone/location.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
# React uses inline style attributes. PDF/document previews use blob URLs.
# Blob images and Sentry ingestion are the existing external integrations.
# No inline/eval script execution and no browser access to Key Vault/DB.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.blob.core.windows.net; font-src 'self' data:; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; worker-src 'self' blob:; frame-src 'self' blob:; form-action 'self'" always;
