name: Release verification

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify-and-deploy:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record Last Known Stable Git Commit
        id: git_state
        run: |
          PREVIOUS_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "${{ github.sha }}")
          CURRENT_SHA="${{ github.sha }}"
          echo "previous_sha=$PREVIOUS_SHA" >> $GITHUB_OUTPUT
          echo "current_sha=$CURRENT_SHA" >> $GITHUB_OUTPUT
          echo "Verifying commit: $CURRENT_SHA (Previous commit: $PREVIOUS_SHA)"

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, dom, fileinfo, gd, intl, mbstring, pdo_pgsql, pdo_sqlite, pgsql, sqlite3, xml, zip
          coverage: none
          ini-values: memory_limit=512M

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend & Frontend Dependencies
        run: |
          cp .env.example .env
          touch database/database.sqlite
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan key:generate
          cd frontend && npm ci && cd ..

      - name: Install PDF test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
          pdfinfo -v

      - name: Build & Verify Artifacts
        id: build_step
        run: |
          echo "Building Frontend Production Assets..."
          cd frontend && npm run build && cd ..
          
          echo "Running Full Test Suite..."
          php artisan migrate --force
          php artisan test

          echo "Running frontend tests..."
          cd frontend && npm test && cd ..
          
          echo "Verifying Laravel Optimization & Cache..."
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Synthetic Health Check Simulation (/up endpoint)
        id: health_check
        run: |
          echo "Starting ephemeral server for health verification..."
          php artisan serve --host=127.0.0.1 --port=8000 &
          SERVER_PID=$!
          
          echo "Pinging health check endpoint..."
          HTTP_CODE=$(curl --retry 10 --retry-delay 1 --retry-connrefused -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/up || echo "000")
          kill $SERVER_PID || true
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Health check failed with HTTP code: $HTTP_CODE"
            exit 1
          fi
          echo "Health check PASSED (HTTP 200 OK)"

      - name: Report verification failure
        if: failure()
        env:
          PREVIOUS_SHA: ${{ steps.git_state.outputs.previous_sha }}
          CURRENT_SHA: ${{ steps.git_state.outputs.current_sha }}
        run: |
          echo "::error::Verification failed for $CURRENT_SHA. The source branch was not modified and Azure was not changed."
          {
            echo "### Verification failed"
            echo "- **Failed commit**: \`$CURRENT_SHA\`"
            echo "- **Previous commit**: \`$PREVIOUS_SHA\`"
            echo "- **Status**: The workflow failed. \`main\` was not changed. Azure was not rolled back because this workflow does not deploy."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
