name: CI verification

on:
  push:
    branches: [ main, master ]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, dom, fileinfo, gd, intl, mbstring, pdo_pgsql, pdo_sqlite, sqlite3, xml, zip
          coverage: none

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend artifacts
        working-directory: frontend
        run: npm run build

      - name: Prepare application environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force

      - name: Run backend test suite
        run: php artisan test

      - name: Run frontend test suite
        working-directory: frontend
        run: npm test

      - name: Start Laravel server
        run: php artisan serve --port=8000 &
        env:
          APP_ENV: production
          APP_DEBUG: false

      - name: Health check
        run: |
          echo "Waiting for server to start..."
          sleep 5
          for i in {1..5}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/up)
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Health check passed with status 200 OK."
              exit 0
            fi
            echo "Attempt $i failed with status $HTTP_STATUS. Retrying in 3 seconds..."
            sleep 3
          done
          echo "Health check failed after 5 attempts."
          exit 1

      - name: Report verification failure
        if: failure()
        run: |
          echo "::error::Verification failed for ${{ github.sha }}. The source branch was not modified."
          {
            echo "### Verification failed"
            echo "- **Failed commit**: \`${{ github.sha }}\`"
            echo "- **Previous commit**: \`${{ github.event.before }}\`"
            echo "- **Status**: The workflow failed. \`main\` was not changed."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
