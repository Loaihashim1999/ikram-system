name: CI Build & Automated Rollback

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-backend:
    name: Backend Test Suite (Laravel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, gd
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Prepare Environment
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate App Key
        run: php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Backend Tests
        run: php artisan test

  build-frontend:
    name: Build & Verify Frontend (Vite & React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

  rollback:
    name: Automatic Rollback
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Revert Broken Commit
        run: |
          COMMIT_TO_REVERT=$(git rev-parse HEAD)
          echo "Build failed on commit $COMMIT_TO_REVERT. Initiating rollback..."
          
          # Check if the commit is a merge commit
          PARENTS=$(git show --no-patch --format="%p" $COMMIT_TO_REVERT)
          if echo "$PARENTS" | grep -q ' '; then
            echo "Reverting merge commit with -m 1..."
            git revert --no-edit -m 1 $COMMIT_TO_REVERT
          else
            echo "Reverting standard commit..."
            git revert --no-edit $COMMIT_TO_REVERT
          fi

      - name: Push Revert to Main
        run: |
          git push origin HEAD:main